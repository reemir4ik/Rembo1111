<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIBUYER — Creative Engine v7.0 PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@700&family=Orbitron:wght@900&display=swap');
:root{--orange:#FF4500;--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#e8e8e8;--muted:#555;--label:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border);background:#0d0d0d}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px;text-transform:uppercase;font-family:'Space Grotesk',sans-serif}
.logo span{color:var(--orange)}
.badge{background:var(--orange);color:#fff;font-family:'Inter',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:6px 14px;text-transform:uppercase}
.stats{display:flex;gap:40px;padding:28px 32px 0}
.stat-num{font-family:'Orbitron',sans-serif;font-size:36px;color:var(--orange);font-weight:900;line-height:1}
.stat-label{font-size:11px;color:var(--label);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;font-weight:600}
.container{max-width:1400px;margin:0 auto;padding:28px 32px 80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-group.full{grid-column:1/-1}
label{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;color:var(--label);text-transform:uppercase;font-weight:600}
input,textarea,select{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:14px 16px;outline:none;transition:all .2s;width:100%;resize:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,69,0,.1)}
input::placeholder,textarea::placeholder{color:#444;opacity:1}
textarea{min-height:80px}
.section-title{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;color:var(--label);text-transform:uppercase;margin-top:32px;margin-bottom:14px;font-weight:700;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:4px;background:var(--orange);border-radius:50%}
.tone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tone-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;padding:14px 10px;cursor:pointer;text-align:center;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.tone-btn:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px)}
.tone-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(255,69,0,.3)}
.smart-suggest{background:#1a1a1a;border:1px solid #2a2a2a;padding:16px;margin-top:12px;border-radius:4px;display:none}
.smart-suggest.show{display:block}
.smart-label{font-size:11px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.suggest-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.suggest-btn{background:var(--card);border:1px solid var(--border);padding:10px 8px;font-size:11px;text-align:center;cursor:pointer;transition:all .2s;font-weight:600;color:#aaa}
.suggest-btn:hover{border-color:var(--orange);color:var(--orange)}
.suggest-btn.selected{border-color:var(--orange);background:#1a0800;color:var(--orange)}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;max-height:450px;overflow-y:auto;padding:6px;background:#0d0d0d;border-radius:4px}
.tmpl-grid::-webkit-scrollbar{width:8px}
.tmpl-grid::-webkit-scrollbar-track{background:#0a0a0a}
.tmpl-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.tmpl-grid::-webkit-scrollbar-thumb:hover{background:#333}
.tmpl-btn{background:var(--card);border:2px solid var(--border);cursor:pointer;transition:all .2s;overflow:hidden;display:flex;flex-direction:column;border-radius:4px}
.tmpl-btn:hover{border-color:#444;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tmpl-btn.active{border-color:var(--orange);box-shadow:0 4px 16px rgba(255,69,0,.3)}
.tmpl-thumb{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;overflow:hidden;background:#050505}
.tmpl-label{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.8px;color:var(--label);padding:8px;text-transform:uppercase;text-align:center;border-top:1px solid var(--border);font-weight:600}
.tmpl-btn.active .tmpl-label{color:var(--orange)}
.tmpl-niche{font-size:7px;color:#555;margin-top:2px}
.bg-section{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:12px}
.bg-upload{border:2px dashed var(--border);padding:24px;text-align:center;cursor:pointer;transition:all .2s;border-radius:4px;background:#0d0d0d}
.bg-upload:hover{border-color:var(--orange);background:#1a0800}
.bg-upload input{display:none}
.bg-upload-icon{font-size:32px;margin-bottom:8px}
.bg-upload-text{font-size:12px;color:var(--muted);font-weight:600}
.bg-upload-hint{font-size:9px;color:#444;margin-top:4px}
.bg-preview{margin-top:12px;max-height:120px;border:1px solid var(--border);border-radius:4px;overflow:hidden;display:none}
.bg-preview img{width:100%;height:100%;object-fit:cover}
.ai-bg-section{display:flex;flex-direction:column;gap:12px}
.ai-toggle{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .2s}
.ai-toggle:hover{border-color:var(--orange)}
.ai-toggle input{width:auto;margin:0}
.ai-toggle-label{font-size:12px;font-weight:600;flex:1}
.ai-prompt{display:none}
.ai-prompt.show{display:block}
.ai-prompt textarea{min-height:60px;font-size:13px}
.color-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:12px}
.color-group{display:flex;flex-direction:column;gap:8px}
.color-row{display:flex;align-items:center;gap:10px}
.color-picker{width:48px;height:48px;border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.color-picker:hover{border-color:var(--orange);transform:scale(1.05)}
.color-picker input{position:absolute;inset:-10px;width:calc(100%+20px);height:calc(100%+20px);border:none;cursor:pointer}
.color-hex{font-family:'Inter',monospace;font-size:11px;background:var(--card);border:1px solid var(--border);padding:10px 12px;width:100px;outline:none;border-radius:4px;font-weight:600}
.color-hex:focus{border-color:var(--orange)}
.preset-colors{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.preset-dot{width:26px;height:26px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.preset-dot:hover{transform:scale(1.1);border-color:rgba(255,255,255,.3)}
.preset-dot.active{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}
.gen-options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding:20px;background:#0d0d0d;border:1px solid var(--border);border-radius:4px}
.gen-option{display:flex;align-items:center;gap:12px}
.gen-option label{margin:0;text-transform:none;letter-spacing:normal;font-size:13px}
.gen-option select{width:auto;padding:8px 12px;font-size:13px}
.logo-upload-wrap{margin-top:12px}
.logo-upload-btn{background:var(--card);border:1px dashed var(--border);padding:20px;text-align:center;cursor:pointer;transition:all .2s;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo-upload-btn:hover{border-color:var(--orange);background:#1a0800}
.logo-upload-btn input{display:none}
.logo-preview{margin-top:10px;max-width:200px;max-height:80px;border:1px solid var(--border);padding:12px;background:var(--card);display:none;border-radius:4px}
.logo-preview img{max-width:100%;max-height:60px;object-fit:contain}
.status-box{margin-top:20px;padding:16px 20px;font-family:'Inter',sans-serif;font-size:12px;display:none;border-radius:4px;font-weight:600}
.status-box.error{background:#1a0800;border:1px solid var(--orange);color:#ff7043;display:flex;align-items:center;gap:10px}
.status-box.loading{background:#111;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:14px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-btn{width:100%;margin-top:24px;background:linear-gradient(135deg,var(--orange),#ff6a00);color:#fff;border:none;font-family:'Inter',sans-serif;font-weight:900;font-size:18px;letter-spacing:2px;text-transform:uppercase;padding:24px;cursor:pointer;transition:all .3s;border-radius:4px;box-shadow:0 4px 16px rgba(255,69,0,.3)}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(255,69,0,.4)}
.gen-btn:active{transform:translateY(0)}
.gen-btn:disabled{background:#333;color:#555;cursor:not-allowed;box-shadow:none}
.results{margin-top:50px;display:none}
.results.visible{display:block}
.results-header{font-family:'Inter',sans-serif;font-size:12px;color:var(--label);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:32px;font-weight:700}
.creatives-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:28px}
.creative-card{background:var(--card);border:1px solid var(--border);overflow:hidden;animation:fadeUp .5s ease both;border-radius:6px;transition:all .3s}
.creative-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4);border-color:#2a2a2a}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-label{font-family:'Inter',sans-serif;font-size:10px;color:var(--orange);letter-spacing:2px;padding:16px 18px 0;font-weight:700;text-transform:uppercase}
.tmpl-tag{font-family:'Inter',sans-serif;font-size:9px;color:var(--muted);padding:4px 18px 0;letter-spacing:1px;font-weight:600}
.banner-preview{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#000;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:10px}
.banner-preview iframe{position:absolute;top:0;left:0;width:1080px;height:1080px;border:none;pointer-events:none;transform-origin:top left}
.card-copy{padding:16px 18px}
.copy-headline{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.copy-sub{font-size:12px;color:#888;margin-bottom:14px;line-height:1.5}
.card-actions{display:flex;gap:8px}
.action-btn{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:1px;padding:10px 8px;cursor:pointer;transition:all .2s;text-transform:uppercase;font-weight:600;border-radius:4px}
.action-btn:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-1px)}
.action-btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.action-btn.primary:hover{background:#ff5722}
.action-btn.copied{border-color:#4caf50;color:#4caf50}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:#111;border:1px solid var(--border);width:700px;max-height:95vh;overflow-y:auto;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.8)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Inter',sans-serif;font-size:12px;color:var(--orange);letter-spacing:2px;text-transform:uppercase;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;transition:color .2s;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.modal-banner-wrap{width:100%;aspect-ratio:1/1;overflow:hidden;border:1px solid var(--border);position:relative;border-radius:4px}
.modal-banner-wrap iframe{position:absolute;top:0;left:0;width:1080px;height:1080px;border:none;transform-origin:top left}
.modal-text{margin-top:20px;background:var(--bg);border:1px solid var(--border);padding:16px;font-size:13px;line-height:1.8;color:#ccc;white-space:pre-wrap;border-radius:4px;font-family:'Inter',monospace}
.modal-actions{display:flex;gap:12px;margin-top:16px}
</style>
</head>
<body>

<header>
  <div class="logo"><span>AI</span>BUYER</div>
  <div class="badge">v7.0 PRO</div>
</header>

<div class="container">
  <div class="stats">
    <div><div class="stat-num" id="genCount">0</div><div class="stat-label">Генераций</div></div>
    <div><div class="stat-num" id="creoCount">0</div><div class="stat-label">Креативов</div></div>
  </div>

  <!-- FORM -->
  <div class="form-grid">
    <div class="form-group">
      <label>Ниша / Тематика</label>
      <input type="text" id="niche" placeholder="Например: Крипто, Финансы, Игры" oninput="suggestTemplates()">
    </div>
    <div class="form-group">
      <label>Название бренда</label>
      <input type="text" id="brand" placeholder="Например: CryptoExchange">
    </div>
    <div class="form-group full">
      <label>Оффер — что предлагаешь</label>
      <textarea id="offer" placeholder="Например: Быстрый обмен криптовалют, низкие комиссии, 24/7 поддержка"></textarea>
    </div>
    <div class="form-group">
      <label>ЦА (Целевая аудитория)</label>
      <input type="text" id="audience" placeholder="Например: 25-45, активные трейдеры">
    </div>
    <div class="form-group">
      <label>УТП / Главный крючок</label>
      <input type="text" id="utp" placeholder="Например: Обмен за 60 секунд, без верификации">
    </div>
    <div class="form-group">
      <label>Контакт</label>
      <input type="text" id="contact" placeholder="@username или https://site.com">
    </div>
    <div class="form-group">
      <label>Призыв к действию (CTA)</label>
      <input type="text" id="goal" placeholder="Например: Начать торговать, Зарегистрироваться">
    </div>
  </div>

  <!-- TONE -->
  <div class="section-title">Тон коммуникации</div>
  <div class="tone-grid">
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','🔥 Провокация')">🔥 Провокация</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','😱 Эмоции')">😱 Эмоции</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','😰 FOMO')">😰 FOMO</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','💎 Премиум')">💎 Премиум</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','⭐ Доверие')">⭐ Доверие</button>
    <button class="tone-btn active" onclick="sel('.tone-btn',this,'tone','🎯 Прямо')">🎯 Прямо</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','😄 Юмор')">😄 Юмор</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','🔮 Интрига')">🔮 Интрига</button>
  </div>

  <!-- SMART TEMPLATE SUGGESTIONS -->
  <div class="smart-suggest" id="smartSuggest">
    <div class="smart-label">💡 Рекомендованные стили для вашей ниши</div>
    <div class="suggest-grid" id="suggestGrid"></div>
  </div>

  <!-- TEMPLATES -->
  <div class="section-title">Визуальный стиль (15 креативных вариантов)</div>
  <div class="tmpl-grid" id="tmplGrid"></div>

  <!-- BACKGROUND -->
  <div class="section-title">Фон баннера</div>
  <div class="bg-section">
    <div>
      <label class="bg-upload" id="bgUploadBtn">
        <div class="bg-upload-icon">🖼️</div>
        <div class="bg-upload-text">Загрузить свой фон</div>
        <div class="bg-upload-hint">PNG, JPG до 5MB • 1080×1080 рекомендуется</div>
        <input type="file" id="bgInput" accept="image/*" onchange="handleBgUpload(event)">
      </label>
      <div class="bg-preview" id="bgPreview"><img id="bgImg" src=""></div>
    </div>
    <div class="ai-bg-section">
      <div class="ai-toggle" onclick="toggleAiBg()">
        <input type="checkbox" id="aiCheck">
        <div class="ai-toggle-label">🤖 AI-генерация фона</div>
      </div>
      <div class="ai-prompt" id="aiPrompt">
        <textarea id="aiPromptText" placeholder="Опиши фон: неоновый город, абстрактные волны, космос..."></textarea>
      </div>
    </div>
  </div>

  <!-- COLORS -->
  <div class="section-title">Цвета</div>
  <div class="color-grid">
    <div class="color-group">
      <label>Акцент</label>
      <div class="color-row">
        <div class="color-picker"><input type="color" id="accentColor" value="#AAFF00" oninput="syncColor('accent')"></div>
        <input type="text" class="color-hex" id="accentHex" value="#AAFF00" onchange="syncHex('accent')">
      </div>
      <div class="preset-colors" id="accentPresets"></div>
    </div>
    <div class="color-group">
      <label>Фон</label>
      <div class="color-row">
        <div class="color-picker"><input type="color" id="bgColor" value="#090f09" oninput="syncColor('bg')"></div>
        <input type="text" class="color-hex" id="bgHex" value="#090F09" onchange="syncHex('bg')">
      </div>
      <div class="preset-colors" id="bgPresets"></div>
    </div>
  </div>

  <!-- LOGO -->
  <div class="section-title">Логотип (опционально)</div>
  <div class="logo-upload-wrap">
    <label class="logo-upload-btn">
      <span>📤 Загрузить логотип</span>
      <span style="font-size:10px;color:#666">PNG, SVG до 2MB</span>
      <input type="file" id="logoInput" accept="image/*" onchange="handleLogoUpload(event)">
    </label>
    <div class="logo-preview" id="logoPreview"><img id="logoImg" src=""></div>
  </div>

  <!-- OPTIONS -->
  <div class="gen-options">
    <div class="gen-option">
      <label>Количество вариантов:</label>
      <select id="genCount">
        <option value="3">3</option>
        <option value="6" selected>6</option>
        <option value="9">9</option>
        <option value="12">12</option>
      </select>
    </div>
    <div class="gen-option">
      <label>Креативность AI:</label>
      <select id="aiTemp">
        <option value="0.7">Сдержанно</option>
        <option value="0.9" selected>Сбалансированно</option>
        <option value="1.1">Креативно</option>
      </select>
    </div>
  </div>

  <div class="status-box error" id="errorBox"><span>⚠</span><span id="errorText"></span></div>
  <div class="status-box loading" id="loadingBox"><div class="spinner"></div><span id="loadingText">Генерирую...</span></div>

  <button class="gen-btn" id="genBtn" onclick="generate()">⚡ СГЕНЕРИРОВАТЬ КРЕАТИВЫ</button>

  <div class="results" id="results">
    <div class="results-header">— Результаты генерации —</div>
    <div class="creatives-grid" id="creoCards"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModalOut(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">ВАРИАНТ 1</div>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-banner-wrap"><iframe id="modalIframe" srcdoc=""></iframe></div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-actions">
        <button class="action-btn primary" onclick="dlBanner()">⬇ Скачать HTML</button>
        <button class="action-btn" id="modalCopyBtn" onclick="copyModalTxt()">Копировать текст</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://aibuyer-backend.vercel.app/api/generate';

const CREATIVE_STYLES = {
  neon:{name:'Неон',niche:['крипто','финансы','технологии','игры'],brandCSS:'font-family:Impact,sans-serif;text-shadow:0 0 20px {{accent}},0 0 40px {{accent}};font-size:110px;letter-spacing:-2px'},
  minimal:{name:'Минимал',niche:['финансы','консалтинг','премиум','B2B'],brandCSS:'font-family:Helvetica,Arial,sans-serif;letter-spacing:0.25em;font-weight:300;font-size:72px'},
  retro:{name:'Ретро',niche:['развлечения','музыка','игры','мода'],brandCSS:'font-family:Impact,sans-serif;font-style:italic;color:{{accent}};-webkit-text-stroke:2px #000;font-size:96px'},
  tech3d:{name:'3D Тех',niche:['технологии','игры','NFT','крипто'],brandCSS:'font-family:Orbitron,Impact,sans-serif;transform:perspective(400px) rotateX(8deg);font-weight:900;font-size:88px'},

let state={tone:'🎯 Прямо',style:'neon',accent:'#AAFF00',bg:'#090f09',bgImg:null,logo:null,aiEnabled:false};
let totalGens=0,totalCreos=0,generatedData=[],currentModal=0;

const ACCENT_PRESETS=['#AAFF00','#FF4500','#00cfff','#FFD700','#ff0080','#00ff88','#ff6600','#a855f7','#ff3860','#00e5ff','#ff1744','#76ff03','#2979ff','#f50057','#ffea00','#ff9100'];
const BG_PRESETS=['#090f09','#0a0a0a','#050d1a','#0a0900','#1a0a00','#0d0014','#0a0a14','#14080a','#0f0f0f','#1a1a1a'];

function buildTmplGrid(){
  const g=document.getElementById('tmplGrid');
  g.innerHTML='';
  Object.entries(CREATIVE_STYLES).forEach(([id,t])=>{
    const b=document.createElement('button');
    b.className='tmpl-btn'+(id===state.style?' active':'');
    b.id='tmpl_'+id;
    b.innerHTML=`<div class="tmpl-thumb">${getThumbSVG(id,t)}</div><div class="tmpl-label">${t.name}<div class="tmpl-niche">${t.niche.slice(0,2).join(', ')}</div></div>`;
    b.onclick=()=>{state.style=id;document.querySelectorAll('.tmpl-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};
    g.appendChild(b);
  });
}

function getThumbSVG(id,t){
  const c=state.accent;
  const styles={
    neon:`<text x="50%" y="55%" text-anchor="middle" font-size="32" font-weight="900" fill="${c}" style="filter:drop-shadow(0 0 8px ${c})">NEON</text>`,
    minimal:`<text x="50%" y="55%" text-anchor="middle" font-size="20" font-weight="300" fill="#ddd" letter-spacing="8">MINIMAL</text>`,
    retro:`<text x="50%" y="55%" text-anchor="middle" font-size="32" font-weight="900" fill="${c}" style="font-style:italic;stroke:#000;stroke-width:2">RETRO</text>`,
    tech3d:`<text x="50%" y="52%" text-anchor="middle" font-size="28" font-weight="900" fill="${c}" style="transform:perspective(200px) rotateX(10deg)">3D</text>`,
    glitch:`<text x="50%" y="55%" text-anchor="middle" font-size="28" font-weight="900" fill="${c}" font-family="monospace">GL1TCH</text>`,
    gradient:`<defs><linearGradient id="g${id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:${c}"/><stop offset="100%" style="stop-color:#00ff88"/></linearGradient></defs><text x="50%" y="55%" text-anchor="middle" font-size="28" font-weight="900" fill="url(#g${id})">GRAD</text>`,
    brutal:`<rect x="20" y="30" width="60" height="40" fill="none" stroke="${c}" stroke-width="3"/><text x="50%" y="55%" text-anchor="middle" font-size="24" font-weight="900" fill="${c}">BRUT</text>`,
    luxury:`<text x="50%" y="55%" text-anchor="middle" font-size="24" font-family="serif" fill="#d4af37" letter-spacing="4">LUX</text>`,
    gaming:`<text x="50%" y="55%" text-anchor="middle" font-size="32" font-weight="700" fill="${c}" letter-spacing="2">GAME</text>`,
    organic:`<text x="50%" y="55%" text-anchor="middle" font-size="26" font-family="serif" fill="#2d5016" style="font-style:italic">eco</text>`,
    comic:`<text x="50%" y="52%" text-anchor="middle" font-size="32" font-weight="900" fill="${c}" stroke="#000" stroke-width="2" style="transform:rotate(-3deg)">POW!</text>`,
    cyber:`<text x="50%" y="55%" text-anchor="middle" font-size="28" font-family="monospace" fill="#0ff" style="filter:drop-shadow(0 0 6px #0ff)">CYBER</text>`,
    artdeco:`<text x="50%" y="55%" text-anchor="middle" font-size="22" font-family="serif" fill="#c9a961" letter-spacing="6">DECO</text>`,
    playful:`<text x="50%" y="52%" text-anchor="middle" font-size="30" font-family="cursive" fill="${c}" stroke="#000" stroke-width="2" style="transform:rotate(-4deg)">FUN</text>`,
    corporate:`<text x="50%" y="55%" text-anchor="middle" font-size="24" font-family="serif" fill="#333" letter-spacing="2">CORP</text>`

}

function suggestTemplates(){
  const niche=document.getElementById('niche').value.toLowerCase().trim();
  if(!niche){document.getElementById('smartSuggest').classList.remove('show');return;}
  const matches=[];
  Object.entries(CREATIVE_STYLES).forEach(([id,t])=>{
    const score=t.niche.reduce((s,n)=>s+(niche.includes(n)?1:0),0);
    if(score>0)matches.push({id,score,...t});
  });
  matches.sort((a,b)=>b.score-a.score);
  const top=matches.slice(0,5);
  if(top.length===0){document.getElementById('smartSuggest').classList.remove('show');return;}
  const g=document.getElementById('suggestGrid');
  g.innerHTML='';
  top.forEach(t=>{
    const b=document.createElement('button');
    b.className='suggest-btn'+(t.id===state.style?' selected':'');
    b.textContent=t.name;
    b.onclick=()=>{
      state.style=t.id;
      document.querySelectorAll('.tmpl-btn').forEach(x=>x.classList.remove('active'));
      document.getElementById('tmpl_'+t.id)?.classList.add('active');
      document.querySelectorAll('.suggest-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    };
    g.appendChild(b);
  });
  document.getElementById('smartSuggest').classList.add('show');
}

function toggleAiBg(){
  state.aiEnabled=!state.aiEnabled;
  document.getElementById('aiCheck').checked=state.aiEnabled;
  document.getElementById('aiPrompt').classList.toggle('show',state.aiEnabled);
}

function buildPresets(id,colors,field){
  const c=document.getElementById(id);
  colors.forEach(col=>{
    const d=document.createElement('div');
    d.className='preset-dot';
    d.style.background=col;
    d.title=col;
    d.onclick=()=>applyColor(field,col);
    c.appendChild(d);
  });
}

function applyColor(field,val){
  val=val.toUpperCase();
  const map={accent:['accentColor','accentHex'],bg:['bgColor','bgHex']};
  const stateMap={accent:'accent',bg:'bg'};
  document.getElementById(map[field][0]).value=val;
  document.getElementById(map[field][1]).value=val;
  state[stateMap[field]]=val;
  buildTmplGrid();
}

function syncColor(field){
  const map={accent:['accentColor','accentHex'],bg:['bgColor','bgHex']};
  const stateMap={accent:'accent',bg:'bg'};
  const val=document.getElementById(map[field][0]).value.toUpperCase();
  document.getElementById(map[field][1]).value=val;
  state[stateMap[field]]=val;
  buildTmplGrid();
}

function syncHex(field){
  const map={accent:['accentColor','accentHex'],bg:['bgColor','bgHex']};
  const stateMap={accent:'accent',bg:'bg'};
  let val=document.getElementById(map[field][1]).value;
  if(!/^#/.test(val))val='#'+val;
  document.getElementById(map[field][0]).value=val;
  state[stateMap[field]]=val.toUpperCase();
  buildTmplGrid();
}

function handleBgUpload(e){
  const f=e.target.files[0];
  if(!f)return;
  if(f.size>5*1024*1024){alert('Файл > 5MB');return;}
  const r=new FileReader();
  r.onload=ev=>{
    state.bgImg=ev.target.result;
    document.getElementById('bgImg').src=state.bgImg;
    document.getElementById('bgPreview').style.display='block';
  };
  r.readAsDataURL(f);
}

function handleLogoUpload(e){
  const f=e.target.files[0];
  if(!f)return;
  if(f.size>2*1024*1024){alert('Файл > 2MB');return;}
  const r=new FileReader();
  r.onload=ev=>{
    state.logo=ev.target.result;
    document.getElementById('logoImg').src=state.logo;
    document.getElementById('logoPreview').style.display='block';
  };
  r.readAsDataURL(f);
}

function sel(selector,btn,field,val){
  document.querySelectorAll(selector).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state[field]=val;
}

function showError(m){document.getElementById('errorText').textContent=m;document.getElementById('errorBox').style.display='flex';document.getElementById('loadingBox').style.display='none'}
function showLoading(m){document.getElementById('loadingText').textContent=m;document.getElementById('loadingBox').style.display='flex';document.getElementById('errorBox').style.display='none'}
function hideStatus(){document.getElementById('loadingBox').style.display='none';document.getElementById('errorBox').style.display='none'}
function escQ(s){return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function scaleIframe(iframe,w){iframe.style.transform=`scale(${w/1080})`}

async function callAPI(prompt,maxTokens=1500){
  const r=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt,maxTokens})
  });
  if(!r.ok){
    const error=await r.json().catch(()=>({}));
    throw new Error(error.error||`HTTP ${r.status}`);
  }
  const d=await r.json();
  return d.content||'';
}

async function generate(){
  const brand=document.getElementById('brand').value.trim()||'БРЕНД';
  const offer=document.getElementById('offer').value.trim();
  const utp=document.getElementById('utp').value.trim();
  const audience=document.getElementById('audience').value.trim();
  const contact=document.getElementById('contact').value.trim();
  const goal=document.getElementById('goal').value.trim();
  const count=parseInt(document.getElementById('genCount').value);
  const temp=parseFloat(document.getElementById('aiTemp').value);
  
  if(!offer){showError('⚠ Заполни поле «Оффер»');return;}

  const btn=document.getElementById('genBtn');
  btn.disabled=true;
  generatedData=[];

  showLoading(`Генерирую ${count} креативных вариантов...`);
  
  const prompt=`Ты — креативный копирайтер. Тон: ${state.tone}.

Бренд: ${brand} | Оффер: ${offer} | УТП: ${utp} | ЦА: ${audience} | CTA: ${goal}

Создай ${count} УНИКАЛЬНЫХ вариантов с РАЗНЫМИ подходами. Для каждого:
- headline: 2-4 слова ЗАГЛАВНЫМИ
- sub: подзаголовок макс 50 символов  
- b1,b2,b3: преимущества макс 30 символов каждое
- cta: призыв 2-4 слова

JSON без markdown:
[{"headline":"...","sub":"...","b1":"...","b2":"...","b3":"...","cta":"..."},...]`;

  let copies;
  try{
    const raw=await callAPI(prompt,2000);
    copies=JSON.parse(raw.replace(/```json|```/g,'').trim());
    while(copies.length<count)copies.push({...copies[copies.length%copies.length]});
  }catch(e){
    showError('⚠ Ошибка: '+e.message);
    btn.disabled=false;
    return;
  }

  showLoading('Создаю визуальные баннеры...');

  const styleData=CREATIVE_STYLES[state.style];
  generatedData=copies.slice(0,count).map((c,i)=>({
    copy:c,
    style:styleData.name,
    html:makeBanner(c,i,styleData,brand,contact)
  }));

  renderResults();
  totalGens++;totalCreos+=count;
  document.getElementById('genCount').textContent=totalGens;
  document.getElementById('creoCount').textContent=totalCreos;
  hideStatus();
  btn.disabled=false;
}

function renderResults(){
  const cont=document.getElementById('creoCards');
  cont.innerHTML='';
  generatedData.forEach((item,i)=>{
    const ft=`${item.copy.headline}\n${item.copy.sub}\n\n✓ ${item.copy.b1}\n✓ ${item.copy.b2}\n✓ ${item.copy.b3}\n\n→ ${item.copy.cta}`;
    const card=document.createElement('div');
    card.className='creative-card';
    card.style.animationDelay=`${(i%6)*0.08}s`;
    card.innerHTML=`
      <div class="card-label">// ВАРИАНТ ${i+1}</div>
      <div class="tmpl-tag">${item.style}</div>
      <div class="banner-preview" id="prev${i}">
        <iframe id="ifr${i}" srcdoc="${escQ(item.html)}" scrolling="no"></iframe>
      </div>
      <div class="card-copy">
        <div class="copy-headline">${item.copy.headline}</div>
        <div class="copy-sub">${item.copy.sub}</div>
        <div class="card-actions">
          <button class="action-btn primary" onclick="openModal(${i})">Открыть</button>
          <button class="action-btn" onclick="cpTxt(this,\`${ft.replace(/`/g,'\\`')}\`)">Копировать</button>
          <button class="action-btn" onclick="dlHTML(${i})">HTML ⬇</button>
        </div>
      </div>`;
    cont.appendChild(card);
  });
  requestAnimationFrame(()=>{
    generatedData.forEach((_,i)=>{
      const p=document.getElementById(`prev${i}`);
      const f=document.getElementById(`ifr${i}`);
      if(p&&f)scaleIframe(f,p.offsetWidth);
    });
  });
  window.addEventListener('resize',()=>{
    generatedData.forEach((_,i)=>{
      const p=document.getElementById(`prev${i}`);
      const f=document.getElementById(`ifr${i}`);
      if(p&&f)scaleIframe(f,p.offsetWidth);
    });
  });
  const r=document.getElementById('results');
  r.classList.add('visible');
  r.scrollIntoView({behavior:'smooth',block:'start'});
}

function openModal(idx){
  currentModal=idx;
  const item=generatedData[idx];
  document.getElementById('modalTitle').textContent=`ВАРИАНТ ${idx+1} — ${item.style}`;
  const mf=document.getElementById('modalIframe');
  mf.srcdoc=item.html;
  document.getElementById('modalText').textContent=
    `${item.copy.headline}\n${item.copy.sub}\n\n✓ ${item.copy.b1}\n✓ ${item.copy.b2}\n✓ ${item.copy.b3}\n\n→ ${item.copy.cta}`;
  document.getElementById('modal').classList.add('open');
  requestAnimationFrame(()=>{
    const w=document.querySelector('.modal-banner-wrap');
    if(w)scaleIframe(mf,w.offsetWidth);
  });
}
function closeModalOut(e){if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')}
function dlBanner(){dlHTML(currentModal)}
function dlHTML(idx){
  const b=new Blob([generatedData[idx].html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`banner-v${idx+1}.html`;a.click();
}
function cpTxt(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.textContent;btn.textContent='✓ OK';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},2000);
  });
}
function copyModalTxt(){
  const t=document.getElementById('modalText').textContent;
  navigator.clipboard.writeText(t).then(()=>{
    const b=document.getElementById('modalCopyBtn');b.textContent='✓ Скопировано';
    setTimeout(()=>b.textContent='Копировать текст',2000);
  });
}

// INIT
buildTmplGrid();
buildPresets('accentPresets',ACCENT_PRESETS,'accent');
buildPresets('bgPresets',BG_PRESETS,'bg');
