<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIBUYER — Creative Engine v5.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@400;600;700;900&display=swap');
:root {
  --orange:#FF4500; --bg:#0a0a0a; --card:#111; --border:#1e1e1e;
  --text:#e8e8e8; --muted:#555; --label:#666;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border);background:#0d0d0d}
.logo{font-weight:900;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.logo span{color:var(--orange)}
.badge{background:var(--orange);color:#fff;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;padding:6px 14px}

.stats{display:flex;gap:40px;padding:28px 32px 0}
.stat-num{font-family:'Space Mono',monospace;font-size:36px;color:var(--orange);font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--label);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

.container{max-width:1200px;margin:0 auto;padding:28px 32px 80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-group.full{grid-column:1/-1}
label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--label);text-transform:uppercase}
input,textarea{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:17px;padding:14px 16px;outline:none;transition:border-color .2s;width:100%;resize:none}
input:focus,textarea:focus{border-color:var(--orange)}
textarea{min-height:80px}

.section-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--label);text-transform:uppercase;margin-top:28px;margin-bottom:12px}

/* TONE */
.tone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tone-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;padding:14px 10px;cursor:pointer;text-align:center;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.tone-btn:hover{border-color:var(--orange);color:var(--orange)}
.tone-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}

/* DESIGN TEMPLATES */
.tmpl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tmpl-btn{background:var(--card);border:2px solid var(--border);cursor:pointer;transition:all .15s;overflow:hidden;display:flex;flex-direction:column}
.tmpl-btn:hover{border-color:#444}
.tmpl-btn.active{border-color:var(--orange)}
.tmpl-thumb{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden}
.tmpl-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--label);padding:8px 10px;text-transform:uppercase;text-align:center;border-top:1px solid var(--border)}
.tmpl-btn.active .tmpl-label{color:var(--orange)}

/* COLOR PALETTE */
.palette-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:0}
.palette-group{display:flex;flex-direction:column;gap:10px}
.palette-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--label);text-transform:uppercase}
.color-row{display:flex;align-items:center;gap:12px}
.color-input-wrap{position:relative;width:48px;height:48px;border:1px solid var(--border);cursor:pointer;overflow:hidden;transition:border-color .2s}
.color-input-wrap:hover{border-color:var(--orange)}
.color-input-wrap input[type=color]{position:absolute;inset:-8px;width:calc(100%+16px);height:calc(100%+16px);border:none;cursor:pointer;padding:0;background:none}
.color-hex{font-family:'Space Mono',monospace;font-size:12px;color:var(--text);background:var(--card);border:1px solid var(--border);padding:8px 12px;outline:none;width:110px;text-transform:uppercase}
.color-hex:focus{border-color:var(--orange)}

.preset-colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.preset-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.preset-dot:hover{transform:scale(1.2)}
.preset-dot.active{border-color:#fff}

/* STATUS */
.status-box{margin-top:20px;padding:14px 18px;font-family:'Space Mono',monospace;font-size:12px;display:none}
.status-box.error{background:#1a0800;border:1px solid var(--orange);color:#ff7043;display:flex;align-items:center;gap:8px}
.status-box.loading{background:#111;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:12px}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

.gen-btn{width:100%;margin-top:20px;background:var(--orange);color:#fff;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:3px;text-transform:uppercase;padding:22px;cursor:pointer;transition:background .2s}
.gen-btn:hover{background:#ff5722}
.gen-btn:disabled{background:#333;color:#555;cursor:not-allowed}

/* RESULTS */
.results{margin-top:40px;display:none}
.results.visible{display:block}
.results-header{font-family:'Space Mono',monospace;font-size:11px;color:var(--label);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:28px}
.creatives-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.creative-card{background:var(--card);border:1px solid var(--border);overflow:hidden;animation:fadeUp .4s ease both}
.creative-card:nth-child(1){animation-delay:0s}
.creative-card:nth-child(2){animation-delay:.1s}
.creative-card:nth-child(3){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--orange);letter-spacing:2px;padding:14px 16px 0}
.tmpl-tag{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);padding:4px 16px 0;letter-spacing:1px}

.banner-preview{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#0d0d0d;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:8px}
.banner-preview iframe{position:absolute;top:0;left:0;width:1080px;height:1080px;border:none;pointer-events:none;transform-origin:top left}

.card-copy{padding:14px 16px}
.copy-headline{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px;text-transform:uppercase}
.copy-sub{font-size:13px;color:#888;margin-bottom:12px}
.card-actions{display:flex;gap:8px}
.action-btn{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:8px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.action-btn:hover{border-color:var(--orange);color:var(--orange)}
.action-btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.action-btn.copied{border-color:#4caf50;color:#4caf50}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:#111;border:1px solid var(--border);width:640px;max-height:95vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Space Mono',monospace;font-size:11px;color:var(--orange);letter-spacing:2px;text-transform:uppercase}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal-body{padding:20px}
.modal-banner-wrap{width:100%;aspect-ratio:1/1;overflow:hidden;border:1px solid var(--border);position:relative}
.modal-banner-wrap iframe{position:absolute;top:0;left:0;width:1080px;height:1080px;border:none;transform-origin:top left}
.modal-text{margin-top:16px;background:var(--bg);border:1px solid var(--border);padding:14px;font-size:14px;line-height:1.7;color:#ccc;white-space:pre-wrap}
.modal-actions{display:flex;gap:10px;margin-top:14px}
</style>
</head>
<body>

<header>
  <div class="logo"><span>AI</span>BUYER</div>
  <div class="badge">Creative Engine v5.0</div>
</header>

<div class="container">
  <div class="stats">
    <div><div class="stat-num" id="genCount">0</div><div class="stat-label">Генераций</div></div>
    <div><div class="stat-num" id="creoCount">0</div><div class="stat-label">Креативов</div></div>
  </div>

  <!-- FORM -->
  <div class="form-grid">
    <div class="form-group">
      <label>Ниша / Тематика</label>
      <input type="text" id="niche" value="Крипто и инвестиции">
    </div>
    <div class="form-group">
      <label>Название бренда</label>
      <input type="text" id="brand" value="USDT Exchange">
    </div>
    <div class="form-group full">
      <label>Оффер</label>
      <textarea id="offer">Онлайн обмен usdt на $, курьеры, счета, sepa и swift переводы</textarea>
    </div>
    <div class="form-group">
      <label>ЦА</label>
      <input type="text" id="audience" value="20-55">
    </div>
    <div class="form-group">
      <label>УТП / Главный крючок</label>
      <input type="text" id="utp" value="низкие комиссии, курьеры по всему миру">
    </div>
    <div class="form-group">
      <label>Контакт (Telegram / сайт)</label>
      <input type="text" id="contact" value="@manager">
    </div>
    <div class="form-group">
      <label>Цель (CTA)</label>
      <input type="text" id="goal" value="Регистрация">
    </div>
  </div>

  <!-- TONE -->
  <div class="section-title">Тон коммуникации</div>
  <div class="tone-grid">
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','🔥 Провокация')">🔥 Провокация</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','😱 Эмоции')">😱 Эмоции</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','😰 FOMO')">😰 FOMO</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','📽️ История')">📽️ История</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','⭐ Соц. доказательство')">⭐ Соц. доказательство</button>
    <button class="tone-btn active" onclick="sel('.tone-btn',this,'tone','🎯 Директ')">🎯 Директ</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','😄 Юмор')">😄 Юмор</button>
    <button class="tone-btn" onclick="sel('.tone-btn',this,'tone','🤫 Интрига')">🤫 Интрига</button>
  </div>

  <!-- DESIGN TEMPLATES -->
  <div class="section-title">Шаблон дизайна</div>
  <div class="tmpl-grid" id="tmplGrid"></div>

  <!-- COLOR PALETTE -->
  <div class="section-title">Палитра цветов</div>
  <div class="palette-section">
    <div class="palette-group">
      <div class="palette-label">Фон</div>
      <div class="color-row">
        <div class="color-input-wrap" id="bgWrap"><input type="color" id="bgColor" value="#090f09" oninput="syncColor('bg')"></div>
        <input type="text" class="color-hex" id="bgHex" value="#090F09" onchange="syncHex('bg')" maxlength="7">
      </div>
      <div class="preset-colors" id="bgPresets"></div>
    </div>
    <div class="palette-group">
      <div class="palette-label">Акцент (текст, кнопки)</div>
      <div class="color-row">
        <div class="color-input-wrap" id="accentWrap"><input type="color" id="accentColor" value="#AAFF00" oninput="syncColor('accent')"></div>
        <input type="text" class="color-hex" id="accentHex" value="#AAFF00" onchange="syncHex('accent')" maxlength="7">
      </div>
      <div class="preset-colors" id="accentPresets"></div>
    </div>
    <div class="palette-group">
      <div class="palette-label">Текст основной</div>
      <div class="color-row">
        <div class="color-input-wrap" id="textWrap"><input type="color" id="textColor" value="#ffffff" oninput="syncColor('text')"></div>
        <input type="text" class="color-hex" id="textHex" value="#FFFFFF" onchange="syncHex('text')" maxlength="7">
      </div>
      <div class="preset-colors" id="textPresets"></div>
    </div>
    <div class="palette-group">
      <div class="palette-label">Зона бренда (фон)</div>
      <div class="color-row">
        <div class="color-input-wrap" id="brandWrap"><input type="color" id="brandColor" value="#ffffff" oninput="syncColor('brand')"></div>
        <input type="text" class="color-hex" id="brandHex" value="#FFFFFF" onchange="syncHex('brand')" maxlength="7">
      </div>
      <div class="preset-colors" id="brandPresets"></div>
    </div>
  </div>

  <div class="status-box error" id="errorBox"><span>⚠</span><span id="errorText"></span></div>
  <div class="status-box loading" id="loadingBox"><div class="spinner"></div><span id="loadingText">Генерирую...</span></div>

  <button class="gen-btn" id="genBtn" onclick="generate()">⚡ СГЕНЕРИРОВАТЬ 3 ВАРИАНТА КРЕО</button>

  <div class="results" id="results">
    <div class="results-header">— Результаты генерации —</div>
    <div class="creatives-grid" id="creoCards"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModalOut(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">ВАРИАНТ 1</div>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-banner-wrap"><iframe id="modalIframe" srcdoc=""></iframe></div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-actions">
        <button class="action-btn primary" onclick="dlBanner()">⬇ Скачать HTML</button>
        <button class="action-btn" id="modalCopyBtn" onclick="copyModalTxt()">Копировать текст</button>
      </div>
    </div>
  </div>
</div>

<script>

   STATE
═══════════════════════════════════════════════════════ */

let totalGens=0, totalCreos=0, generatedData=[], currentModal=0;

/* ═══════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════
   PRESET COLORS
═══════════════════════════════════════════════════════ */
const BG_PRESETS    = ['#090f09','#0a0a0a','#050d1a','#0a0900','#1a0a00','#0d0014','#0a0a14','#14080a','#f5f5f0','#ffffff'];

function buildPresets(containerId, colors, field) {
  const c = document.getElementById(containerId);
  colors.forEach(col => {
    const d = document.createElement('div');
    d.className = 'preset-dot';
    d.style.background = col;
    d.title = col;
    d.onclick = () => applyColor(field, col);
    c.appendChild(d);
  });
}

function applyColor(field, val) {
  val = val.toUpperCase();
  const map = { bg:['bgColor','bgHex'], accent:['accentColor','accentHex'], text:['textColor','textHex'], brand:['brandColor','brandHex'] };
  const stateMap = { bg:'bg', accent:'accent', text:'textCol', brand:'brandBg' };
  document.getElementById(map[field][0]).value = val;
  document.getElementById(map[field][1]).value = val;
  state[stateMap[field]] = val;
  refreshTmplThumbs();
}

function syncColor(field) {
  const map = { bg:['bgColor','bgHex'], accent:['accentColor','accentHex'], text:['textColor','textHex'], brand:['brandColor','brandHex'] };
  const stateMap = { bg:'bg', accent:'accent', text:'textCol', brand:'brandBg' };
  const val = document.getElementById(map[field][0]).value.toUpperCase();
  document.getElementById(map[field][1]).value = val;
  state[stateMap[field]] = val;
  refreshTmplThumbs();
}

function syncHex(field) {
  const map = { bg:['bgColor','bgHex'], accent:['accentColor','accentHex'], text:['textColor','textHex'], brand:['brandColor','brandHex'] };
  const stateMap = { bg:'bg', accent:'accent', text:'textCol', brand:'brandBg' };
  let val = document.getElementById(map[field][1]).value;
  if (!/^#/.test(val)) val = '#'+val;
  document.getElementById(map[field][0]).value = val;
  state[stateMap[field]] = val.toUpperCase();
  refreshTmplThumbs();
}

function buildTmplGrid() {
  const grid = document.getElementById('tmplGrid');
  grid.innerHTML = '';
  TEMPLATES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tmpl-btn' + (t.id === state.template ? ' active' : '');
    btn.id = 'tmpl_' + t.id;
    btn.innerHTML = `<div class="tmpl-thumb">${t.thumb(state.accent, state.bg)}</div><div class="tmpl-label">${t.name}</div>`;
    btn.onclick = () => { state.template = t.id; document.querySelectorAll('.tmpl-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); };
    grid.appendChild(btn);
  });
}

function refreshTmplThumbs() {
  TEMPLATES.forEach(t => {
    const btn = document.getElementById('tmpl_' + t.id);
    if (btn) btn.querySelector('.tmpl-thumb').innerHTML = t.thumb(state.accent, state.bg);
  });
}

function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '170,255,0';
}

// API endpoint — подключен к Vercel бэкенду
const API_ENDPOINT = 'https://aibuyer-backend.vercel.app/api/generate';

async function callClaude(prompt, maxTokens=1200) {
  const r = await fetch(API_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prompt, maxTokens })
  });
  
  if (!r.ok) {
    const error = await r.json().catch(() => ({}));
    throw new Error(error.error || `HTTP ${r.status}`);
  }
  
  const d = await r.json();
  return d.content || '';
}

async function generate() {
  const brand   = document.getElementById('brand').value.trim()||'БРЕНД';
  const offer   = document.getElementById('offer').value.trim();
  const utp     = document.getElementById('utp').value.trim();
  const audience= document.getElementById('audience').value.trim();
  const contact = document.getElementById('contact').value.trim();
  const goal    = document.getElementById('goal').value.trim();
  if (!offer) { showError('⚠ Заполни поле «Оффер»'); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true; generatedData = [];

  showLoading('Генерирую тексты...');
  const prompt = `Копирайтер для рекламных баннеров (финансы/крипто). Тон: ${state.tone}.

Данные: Бренд: ${brand} | Оффер: ${offer} | УТП: ${utp} | ЦА: ${audience} | Цель: ${goal}

Создай 3 разных варианта. Для каждого:
- headline: 2-4 слова КАПСЛОК (без emoji, без знаков препинания)
- sub: подзаголовок макс 45 символов
- b1, b2, b3: три преимущества макс 28 символов каждый
- cta: призыв 2-4 слова

JSON без markdown:
[{"headline":"...","sub":"...","b1":"...","b2":"...","b3":"...","cta":"..."},{"headline":"...","sub":"...","b1":"...","b2":"...","b3":"...","cta":"..."},{"headline":"...","sub":"...","b1":"...","b2":"...","b3":"...","cta":"..."}]`;

  let copies;
  try {
    const raw = await callClaude(prompt);
    copies = JSON.parse(raw.replace(/```json|```/g,'').trim());
  } catch(e) {
    showError('⚠ Ошибка: ' + e.message);
    btn.disabled = false; return;
  }

  showLoading('Рендерю баннеры...');

  const s = { bg: state.bg, accent: state.accent, text: state.textCol, brandBg: state.brandBg, rgb: hexToRgb(state.accent) };
  const tmplId = state.template;
  const tmplName = TEMPLATES.find(t=>t.id===tmplId)?.name || tmplId;

  generatedData = copies.map((c,i) => ({
    copy: c,
    tmpl: tmplName,
    html: makeBanner(c, i, s, brand, contact, tmplId)
  }));

  renderResults();
  totalGens++; totalCreos+=3;
  document.getElementById('genCount').textContent = totalGens;
  document.getElementById('creoCount').textContent = totalCreos;
  hideStatus();
  btn.disabled = false;
}

function makeChart(rgb, idx) {
  const datasets = [
    [[38,65,34,62],[62,86,58,83],[80,96,76,93],[92,116,86,113],[110,133,104,128],[126,150,120,146],[143,166,138,163],[158,176,152,173]],
    [[68,88,63,86],[83,103,78,100],[98,120,93,116],[116,136,110,133],[133,156,128,152],[148,170,143,166],[163,180,156,178],[176,193,170,190]],
    [[53,73,48,70],[70,90,65,87],[86,106,81,103],[102,123,97,120],[118,140,113,136],[134,156,128,153],[148,168,142,165],[161,180,155,177]],
  ];
  const bars = datasets[idx % 3];
  let svg = ''; let pts = [];
  bars.forEach((bar,i) => {
    const [o,h,l,c] = bar; const scale=3.5; const x=120+i*115;
    const yo=1080-o*scale,yh=1080-h*scale,yl=1080-l*scale,yc=1080-c*scale;
    const bull=c>=o; const col=bull?`rgba(${rgb},.85)`:'rgba(255,80,80,.75)';
    const bTop=Math.min(yo,yc), bH=Math.max(Math.abs(yc-yo),5);
    svg+=`<line x1="${x}" y1="${yh}" x2="${x}" y2="${yl}" stroke="${col}" stroke-width="4"/>`;
    svg+=`<rect x="${x-32}" y="${bTop}" width="64" height="${bH}" fill="${col}" rx="3"/>`;
    pts.push(`${i===0?'M':'L'} ${x} ${(yo+yc)/2}`);
  });
  return { candles: svg, line: pts.join(' ') };
}

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function renderResults() {
  const cont = document.getElementById('creoCards');
  cont.innerHTML = '';
  generatedData.forEach((item, i) => {
    const ft = `${item.copy.headline}\n${item.copy.sub}\n\n✓ ${item.copy.b1}\n✓ ${item.copy.b2}\n✓ ${item.copy.b3}\n\n→ ${item.copy.cta}`;
    const card = document.createElement('div');
    card.className = 'creative-card';
    card.innerHTML = `
      <div class="card-label">// ВАРИАНТ ${i+1}</div>
      <div class="tmpl-tag">${item.tmpl}</div>
      <div class="banner-preview" id="prev${i}">
        <iframe id="ifr${i}" srcdoc="${escQ(item.html)}" scrolling="no"></iframe>
      </div>
      <div class="card-copy">
        <div class="copy-headline">${item.copy.headline}</div>
        <div class="copy-sub">${item.copy.sub}</div>
        <div class="card-actions">
          <button class="action-btn primary" onclick="openModal(${i})">Открыть</button>
          <button class="action-btn" onclick="cpTxt(this,\`${ft.replace(/`/g,'\\`')}\`)">Копировать</button>
          <button class="action-btn" onclick="dlHTML(${i})">HTML ⬇</button>
        </div>
      </div>`;
    cont.appendChild(card);
  });
  requestAnimationFrame(() => {
    generatedData.forEach((_,i) => {
      const p = document.getElementById(`prev${i}`);
      const f = document.getElementById(`ifr${i}`);
      if (p && f) scaleIframe(f, p.offsetWidth);
    });
  });
  window.addEventListener('resize', () => {
    generatedData.forEach((_,i) => {
      const p = document.getElementById(`prev${i}`);
      const f = document.getElementById(`ifr${i}`);
      if (p && f) scaleIframe(f, p.offsetWidth);
    });
  });
  const r = document.getElementById('results');
  r.classList.add('visible');
  r.scrollIntoView({ behavior:'smooth', block:'start' });
}

function openModal(idx) {
  currentModal = idx;
  const item = generatedData[idx];
  document.getElementById('modalTitle').textContent = `ВАРИАНТ ${idx+1} — ${item.tmpl}`;
  const mf = document.getElementById('modalIframe');
  mf.srcdoc = item.html;
  document.getElementById('modalText').textContent =
    `${item.copy.headline}\n${item.copy.sub}\n\n✓ ${item.copy.b1}\n✓ ${item.copy.b2}\n✓ ${item.copy.b3}\n\n→ ${item.copy.cta}`;
  document.getElementById('modal').classList.add('open');
  requestAnimationFrame(() => {
    const w = document.querySelector('.modal-banner-wrap');
    if (w) scaleIframe(mf, w.offsetWidth);
  });
}
function closeModalOut(e) { if (e.target.id==='modal') document.getElementById('modal').classList.remove('open'); }
function dlBanner() { dlHTML(currentModal); }
function dlHTML(idx) {
  const b = new Blob([generatedData[idx].html],{type:'text/html'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=`banner-v${idx+1}.html`; a.click();
}
function cpTxt(btn, text) {
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.textContent; btn.textContent='✓ OK'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},2000);
  });
}
function copyModalTxt() {
  const t = document.getElementById('modalText').textContent;
  navigator.clipboard.writeText(t).then(()=>{
    const b=document.getElementById('modalCopyBtn'); b.textContent='✓ Скопировано';
    setTimeout(()=>b.textContent='Копировать текст',2000);
  });
}
