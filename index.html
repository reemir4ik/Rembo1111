<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIBUYER Creative Engine v8.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF4500;--bg:#0a0a0a;--card:#111;--border:#1e1e1e;--text:#e8e8e8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);background:#0d0d0d}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-1px}
.logo span{color:var(--orange)}
.badge{background:var(--orange);color:#fff;font-size:9px;font-weight:700;padding:7px 16px;text-transform:uppercase;letter-spacing:2px;border-radius:3px}
.stats{display:flex;gap:50px;padding:30px 40px}
.stat-box{text-align:center}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:42px;color:var(--orange);font-weight:700;line-height:1}
.stat-label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:1.5px;margin-top:8px;font-weight:600}
.container{max-width:1400px;margin:0 auto;padding:30px 40px 100px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}
.form-group{display:flex;flex-direction:column;gap:10px}
.form-group.full{grid-column:1/-1}
label{font-size:11px;letter-spacing:2px;color:#666;text-transform:uppercase;font-weight:700}
input,textarea,select{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:15px;padding:16px 18px;outline:none;transition:all .2s;width:100%;resize:none;border-radius:6px;font-family:Inter,sans-serif}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,69,0,.08)}
input::placeholder,textarea::placeholder{color:#444}
textarea{min-height:90px;line-height:1.5}
.section-title{font-size:11px;letter-spacing:2.5px;color:#888;text-transform:uppercase;margin-top:40px;margin-bottom:18px;font-weight:700;display:flex;align-items:center;gap:12px}
.section-title::before{content:'';width:4px;height:4px;background:var(--orange);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.tone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tone-btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;padding:16px;cursor:pointer;text-align:center;transition:all .25s;text-transform:uppercase;letter-spacing:1.2px;border-radius:6px}
.tone-btn:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tone-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 6px 20px rgba(255,69,0,.35)}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;max-height:500px;overflow-y:auto;padding:8px;background:#0d0d0d;border-radius:8px;border:1px solid var(--border)}
.tmpl-grid::-webkit-scrollbar{width:10px}
.tmpl-grid::-webkit-scrollbar-track{background:#0a0a0a;border-radius:5px}
.tmpl-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.tmpl-grid::-webkit-scrollbar-thumb:hover{background:#333}
.tmpl-btn{background:var(--card);border:2px solid var(--border);cursor:pointer;transition:all .25s;overflow:hidden;display:flex;flex-direction:column;border-radius:8px}
.tmpl-btn:hover{border-color:#444;transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.tmpl-btn.active{border-color:var(--orange);box-shadow:0 8px 24px rgba(255,69,0,.35)}
.tmpl-thumb{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:20px;background:#050505;position:relative;overflow:hidden}
.tmpl-label{font-size:10px;letter-spacing:1px;color:#666;padding:10px;text-transform:uppercase;text-align:center;border-top:1px solid var(--border);font-weight:700}
.tmpl-btn.active .tmpl-label{color:var(--orange)}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
.color-group{display:flex;flex-direction:column;gap:12px}
.color-row{display:flex;align-items:center;gap:14px}
.color-picker{width:56px;height:56px;border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.color-picker:hover{border-color:var(--orange);transform:scale(1.05)}
.color-picker input{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);border:none;cursor:pointer}
.color-hex{font-family:monospace;font-size:12px;background:var(--card);border:1px solid var(--border);padding:12px 16px;width:120px;outline:none;border-radius:6px;font-weight:700;color:var(--text)}
.color-hex:focus{border-color:var(--orange)}
.preset-colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.preset-dot{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.preset-dot:hover{transform:scale(1.12);border-color:rgba(255,255,255,.3)}
.gen-options{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;padding:24px;background:#0d0d0d;border:1px solid var(--border);border-radius:8px}
.gen-option{display:flex;align-items:center;gap:14px}
.gen-option label{margin:0;text-transform:none;letter-spacing:normal;font-size:14px;font-weight:600}
.gen-option select{width:auto;padding:10px 16px;font-size:14px;cursor:pointer}
.status-box{margin-top:24px;padding:18px 24px;font-size:13px;display:none;border-radius:8px;font-weight:600}
.status-box.error{background:#1a0800;border:1px solid var(--orange);color:#ff7043;display:flex;align-items:center;gap:12px}
.status-box.loading{background:var(--card);border:1px solid var(--border);color:#888;display:flex;align-items:center;gap:16px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-btn{width:100%;margin-top:28px;background:linear-gradient(135deg,var(--orange),#ff6a00);color:#fff;border:none;font-family:Inter,sans-serif;font-weight:900;font-size:19px;letter-spacing:2.5px;text-transform:uppercase;padding:26px;cursor:pointer;transition:all .3s;border-radius:8px;box-shadow:0 6px 20px rgba(255,69,0,.3)}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,69,0,.45)}
.gen-btn:active{transform:translateY(0)}
.gen-btn:disabled{background:#333;color:#666;cursor:not-allowed;box-shadow:none;transform:none}
.results{margin-top:60px;display:none}
.results.visible{display:block}
.results-header{font-size:13px;color:#888;letter-spacing:2.5px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:36px;font-weight:700}
.creatives-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:32px}
.creative-card{background:var(--card);border:1px solid var(--border);overflow:hidden;animation:fadeUp .5s ease both;border-radius:10px;transition:all .3s}
.creative-card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.5);border-color:#2a2a2a}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.card-label{font-size:11px;color:var(--orange);letter-spacing:2.5px;padding:18px 20px 0;font-weight:700;text-transform:uppercase}
.tmpl-tag{font-size:10px;color:#666;padding:6px 20px 0;letter-spacing:1.2px;font-weight:600}
.banner-preview{width:100%;aspect-ratio:1;position:relative;overflow:hidden;background:#000;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:12px}
.banner-preview iframe{position:absolute;top:0;left:0;width:1080px;height:1080px;border:none;pointer-events:none;transform-origin:top left}
.card-copy{padding:18px 20px}
.copy-headline{font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
.copy-sub{font-size:13px;color:#999;margin-bottom:16px;line-height:1.6}
.card-actions{display:flex;gap:10px}
.action-btn{flex:1;background:transparent;border:1px solid var(--border);color:#888;font-size:11px;letter-spacing:1.2px;padding:12px;cursor:pointer;transition:all .2s;text-transform:uppercase;font-weight:700;border-radius:6px;font-family:Inter,sans-serif}
.action-btn:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-1px)}
.action-btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.action-btn.primary:hover{background:#ff5722}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);width:740px;max-height:96vh;overflow-y:auto;border-radius:12px;box-shadow:0 16px 64px rgba(0,0,0,.9)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;border-bottom:1px solid var(--border)}
.modal-title{font-size:13px;color:var(--orange);letter-spacing:2.5px;text-transform:uppercase;font-weight:700}
.modal-close{background:none;border:none;color:#888;font-size:28px;cursor:pointer;transition:color .2s;padding:0 8px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:28px}
.modal-banner-wrap{width:100%;aspect-ratio:1;overflow:hidden;border:1px solid var(--border);position:relative;border-radius:8px;background:#000}
.modal-banner-wrap iframe{position:absolute;top:0;left:0;width:1080px;height:1080px;border:none;transform-origin:top left}
.modal-text{margin-top:24px;background:var(--bg);border:1px solid var(--border);padding:20px;font-size:14px;line-height:1.9;color:#ccc;white-space:pre-wrap;border-radius:8px;font-family:monospace}
.modal-actions{display:flex;gap:14px;margin-top:20px}
</style>
</head>
<body>
<header>
<div class="logo"><span>AI</span>BUYER</div>
<div class="badge">v8.0</div>
</header>
<div class="container">
<div class="stats">
<div class="stat-box"><div class="stat-num" id="genCount">0</div><div class="stat-label">Генераций</div></div>
<div class="stat-box"><div class="stat-num" id="creoCount">0</div><div class="stat-label">Креативов</div></div>
</div>
<div class="form-grid">
<div class="form-group"><label>Ниша</label><input id="niche" placeholder="Крипто, Финансы, Игры..."></div>
<div class="form-group"><label>Бренд</label><input id="brand" placeholder="CryptoExchange"></div>
<div class="form-group full"><label>Оффер</label><textarea id="offer" placeholder="Быстрый обмен криптовалют, низкие комиссии, 24/7 поддержка"></textarea></div>
<div class="form-group"><label>ЦА</label><input id="audience" placeholder="25-45, активные трейдеры"></div>
<div class="form-group"><label>УТП</label><input id="utp" placeholder="Обмен за 60 секунд"></div>
<div class="form-group"><label>Контакт</label><input id="contact" placeholder="@username"></div>
<div class="form-group"><label>CTA</label><input id="goal" placeholder="Начать торговать"></div>
</div>
<div class="section-title">Тон коммуникации</div>
<div class="tone-grid">
<button class="tone-btn" onclick="setTone(this,'🔥 Провокация')">🔥 Провокация</button>
<button class="tone-btn" onclick="setTone(this,'😱 Эмоции')">😱 Эмоции</button>
<button class="tone-btn" onclick="setTone(this,'😰 FOMO')">😰 FOMO</button>
<button class="tone-btn" onclick="setTone(this,'💎 Премиум')">💎 Премиум</button>
<button class="tone-btn" onclick="setTone(this,'⭐ Доверие')">⭐ Доверие</button>
<button class="tone-btn active" onclick="setTone(this,'🎯 Прямо')">🎯 Прямо</button>
<button class="tone-btn" onclick="setTone(this,'😄 Юмор')">😄 Юмор</button>
<button class="tone-btn" onclick="setTone(this,'🔮 Интрига')">🔮 Интрига</button>
</div>
<div class="section-title">Визуальный стиль</div>
<div class="tmpl-grid" id="tmplGrid"></div>
<div class="section-title">Цвета</div>
<div class="color-grid">
<div class="color-group"><label>Акцент</label><div class="color-row"><div class="color-picker"><input type="color" id="accentColor" value="#AAFF00" oninput="syncColor('accent')"></div><input class="color-hex" id="accentHex" value="#AAFF00" onchange="syncHex('accent')"></div><div class="preset-colors" id="accentPresets"></div></div>
<div class="color-group"><label>Фон</label><div class="color-row"><div class="color-picker"><input type="color" id="bgColor" value="#090f09" oninput="syncColor('bg')"></div><input class="color-hex" id="bgHex" value="#090F09" onchange="syncHex('bg')"></div><div class="preset-colors" id="bgPresets"></div></div>
</div>
<div class="gen-options">
<div class="gen-option"><label>Количество:</label><select id="genCountSel"><option value="3">3</option><option value="6" selected>6</option><option value="9">9</option></select></div>
<div class="gen-option"><label>Креативность:</label><select id="aiTemp"><option value="0.7">Сдержанно</option><option value="0.9" selected>Сбалансированно</option><option value="1.1">Креативно</option></select></div>
</div>
<div class="status-box error" id="errorBox"><span>⚠</span><span id="errorText"></span></div>
<div class="status-box loading" id="loadingBox"><div class="spinner"></div><span id="loadingText"></span></div>
<button class="gen-btn" id="genBtn" onclick="generate()">⚡ СГЕНЕРИРОВАТЬ КРЕАТИВЫ</button>
<div class="results" id="results">
<div class="results-header">— Результаты генерации —</div>
<div class="creatives-grid" id="creoCards"></div>
</div>
</div>
<div class="modal-overlay" id="modal" onclick="if(event.target.id==='modal')this.classList.remove('open')">
<div class="modal-box">
<div class="modal-header"><div class="modal-title" id="modalTitle"></div><button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button></div>
<div class="modal-body"><div class="modal-banner-wrap"><iframe id="modalIframe"></iframe></div><div class="modal-text" id="modalText"></div><div class="modal-actions"><button class="action-btn primary" onclick="dlBanner()">⬇ Скачать</button><button class="action-btn" onclick="copyModalTxt()">Копировать</button></div></div>
</div>
</div>
<script>
const API='https://aibuyer-backend.vercel.app/api/generate';
const STYLES={
neon:{name:'Неон',css:'font-family:Impact;text-shadow:0 0 20px {{accent}},0 0 40px {{accent}};font-size:110px;letter-spacing:-2px'},
minimal:{name:'Минимал',css:'font-family:Helvetica;letter-spacing:0.25em;font-weight:300;font-size:72px'},
retro:{name:'Ретро',css:'font-family:Impact;font-style:italic;color:{{accent}};-webkit-text-stroke:2px #000;font-size:96px'},
glitch:{name:'Глитч',css:'font-family:Courier New;font-weight:900;letter-spacing:8px;font-size:92px'},
gradient:{name:'Градиент',css:'background:linear-gradient(135deg,{{accent}},#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;font-size:100px'},
luxury:{name:'Люкс',css:'font-family:Didot;color:#d4af37;text-shadow:2px 2px 0 rgba(0,0,0,0.4);letter-spacing:0.15em;font-size:80px'},
gaming:{name:'Гейминг',css:'font-family:Teko;font-weight:700;color:{{accent}};text-transform:uppercase;font-size:120px;letter-spacing:4px'},
cyber:{name:'Кибер',css:'font-family:Orbitron;color:#0ff;text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 30px #0ff;font-size:96px;letter-spacing:2px'}
};
let state={tone:'🎯 Прямо',style:'neon',accent:'#AAFF00',bg:'#090f09'};
let totalGens=0,totalCreos=0,generatedData=[],currentModal=0;
const ACCENT_PRESETS=['#AAFF00','#FF4500','#00cfff','#FFD700','#ff0080','#00ff88','#ff6600','#a855f7','#ff3860','#00e5ff','#ff1744','#76ff03','#2979ff','#f50057','#ffea00','#ff9100'];
const BG_PRESETS=['#090f09','#0a0a0a','#050d1a','#0a0900','#1a0a00','#0d0014','#0a0a14','#14080a','#0f0f0f','#1a1a1a'];
function buildTmplGrid(){
const g=document.getElementById('tmplGrid');
Object.entries(STYLES).forEach(([id,t])=>{
const b=document.createElement('button');
b.className='tmpl-btn'+(id===state.style?' active':'');
b.innerHTML=`<div class="tmpl-thumb">${getThumb(id)}</div><div class="tmpl-label">${t.name}</div>`;
b.onclick=()=>{state.style=id;document.querySelectorAll('.tmpl-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')};
g.appendChild(b);
});
}
function getThumb(id){
const c=state.accent;
const thumbs={
neon:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="32" font-weight="900" fill="${c}" style="filter:drop-shadow(0 0 8px ${c})">NEON</text></svg>`,
minimal:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="20" font-weight="300" fill="#ddd" letter-spacing="8">MINIMAL</text></svg>`,
retro:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="32" font-weight="900" fill="${c}" style="font-style:italic;stroke:#000;stroke-width:2">RETRO</text></svg>`,
glitch:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="28" font-weight="900" fill="${c}" font-family="monospace">GL1TCH</text></svg>`,
gradient:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g${id}"><stop offset="0%" style="stop-color:${c}"/><stop offset="100%" style="stop-color:#00ff88"/></linearGradient></defs><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="28" font-weight="900" fill="url(#g${id})">GRAD</text></svg>`,
luxury:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="24" font-family="serif" fill="#d4af37" letter-spacing="4">LUX</text></svg>`,
gaming:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="32" font-weight="700" fill="${c}" letter-spacing="2">GAME</text></svg>`,
cyber:`<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050505"/><text x="50%" y="55%" text-anchor="middle" font-size="28" font-family="monospace" fill="#0ff" style="filter:drop-shadow(0 0 6px #0ff)">CYBER</text></svg>`
};
return thumbs[id]||'';
}
function buildPresets(id,colors,field){
const c=document.getElementById(id);
colors.forEach(col=>{
const d=document.createElement('div');
d.className='preset-dot';
d.style.background=col;
d.onclick=()=>applyColor(field,col);
c.appendChild(d);
});
}
function applyColor(field,val){
const map={accent:['accentColor','accentHex'],bg:['bgColor','bgHex']};
const stateMap={accent:'accent',bg:'bg'};
document.getElementById(map[field][0]).value=val;
document.getElementById(map[field][1]).value=val;
state[stateMap[field]]=val;
buildTmplGrid();
}
function syncColor(field){
const map={accent:['accentColor','accentHex'],bg:['bgColor','bgHex']};
const stateMap={accent:'accent',bg:'bg'};
const val=document.getElementById(map[field][0]).value.toUpperCase();
document.getElementById(map[field][1]).value=val;
state[stateMap[field]]=val;
buildTmplGrid();
}
function syncHex(field){
const map={accent:['accentColor','accentHex'],bg:['bgColor','bgHex']};
const stateMap={accent:'accent',bg:'bg'};
let val=document.getElementById(map[field][1]).value;
if(!/^#/.test(val))val='#'+val;
document.getElementById(map[field][0]).value=val;
state[stateMap[field]]=val.toUpperCase();
buildTmplGrid();
}
function setTone(btn,val){
document.querySelectorAll('.tone-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
state.tone=val;
}
function showError(m){if(!m)return;document.getElementById('errorText').textContent=m;document.getElementById('errorBox').style.display='flex';document.getElementById('loadingBox').style.display='none'}
function showLoading(m){document.getElementById('loadingText').textContent=m;document.getElementById('loadingBox').style.display='flex';document.getElementById('errorBox').style.display='none'}
function hideStatus(){document.getElementById('loadingBox').style.display='none';document.getElementById('errorBox').style.display='none'}
function escQ(s){return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function scaleIframe(iframe,w){iframe.style.transform=`scale(${w/1080})`}
async function callAPI(prompt,maxTokens=1500){
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,maxTokens})});
if(!r.ok){const error=await r.json().catch(()=>({}));throw new Error(error.error||`HTTP ${r.status}`)}
const d=await r.json();
return d.content||'';
}
async function generate(){
const brand=document.getElementById('brand').value.trim()||'БРЕНД';
const offer=document.getElementById('offer').value.trim();
const utp=document.getElementById('utp').value.trim();
const audience=document.getElementById('audience').value.trim();
const contact=document.getElementById('contact').value.trim();
const goal=document.getElementById('goal').value.trim();
const count=parseInt(document.getElementById('genCountSel').value);
if(!offer){showError('⚠ Заполни поле «Оффер»');return}
const btn=document.getElementById('genBtn');
btn.disabled=true;
generatedData=[];
showLoading(`Генерирую ${count} вариантов...`);
const prompt=`Ты — креативный копирайтер. Тон: ${state.tone}.
Бренд: ${brand} | Оффер: ${offer} | УТП: ${utp} | ЦА: ${audience} | CTA: ${goal}
Создай ${count} УНИКАЛЬНЫХ вариантов. Для каждого:
- headline: 2-4 слова ЗАГЛАВНЫМИ
- sub: подзаголовок макс 50 символов
- b1,b2,b3: преимущества макс 30 символов
- cta: призыв 2-4 слова
JSON без markdown:
[{"headline":"...","sub":"...","b1":"...","b2":"...","b3":"...","cta":"..."},...]`;
let copies;
try{
const raw=await callAPI(prompt,2000);
copies=JSON.parse(raw.replace(/```json|```/g,'').trim());
while(copies.length<count)copies.push({...copies[0]});
}catch(e){
showError('⚠ Ошибка: '+e.message);
btn.disabled=false;
return;
}
showLoading('Создаю баннеры...');
const styleData=STYLES[state.style];
generatedData=copies.slice(0,count).map((c,i)=>({
copy:c,
style:styleData.name,
html:makeBanner(c,styleData,brand,contact)
}));
renderResults();
totalGens++;totalCreos+=count;
document.getElementById('genCount').textContent=totalGens;
document.getElementById('creoCount').textContent=totalCreos;
hideStatus();
btn.disabled=false;
}
function makeBanner(c,styleData,brand,contact){
const brandCSS=styleData.css.replace(/\{\{accent\}\}/g,state.accent);
const icon=contact.startsWith('@')?'✈':contact.startsWith('http')?'🌐':'✈';
const headlineSize=c.headline.length>12?84:c.headline.length>8?96:108;
return `<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Orbitron:wght@900&family=Teko:wght@700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1080px;overflow:hidden}.bg{position:absolute;inset:0;background:linear-gradient(135deg,${state.bg},${state.accent}11)}.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 20%,${state.bg}dd 60%,${state.bg} 85%)}.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:60px 50px 50px}.brand{${brandCSS};color:${state.accent};text-align:center;margin-bottom:30px;line-height:1;max-width:90%;align-self:center;word-wrap:break-word}.headline{font-family:Inter;font-size:${headlineSize}px;font-weight:900;line-height:.88;text-transform:uppercase;color:#fff;letter-spacing:-2px;text-shadow:0 4px 20px rgba(0,0,0,.6);margin-bottom:20px;word-wrap:break-word}.sub{font-family:Inter;font-size:28px;color:rgba(255,255,255,.8);line-height:1.4;margin-bottom:30px}.benefits{display:flex;flex-direction:column;gap:14px;margin-bottom:auto}.benefit{display:flex;align-items:center;gap:14px}.chk{width:36px;height:36px;flex-shrink:0;background:${state.accent};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#000;border-radius:4px}.bt{font-family:Inter;font-size:24px;color:#fff;opacity:.9;max-width:700px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:30px}.cta{background:${state.accent};color:#000;font-family:Inter;font-size:26px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:20px 50px;border:none;border-radius:6px;box-shadow:0 4px 16px ${state.accent}66}.contact{font-family:Inter;font-size:22px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:10px;font-weight:600}</style></head><body><div class="bg"></div><div class="overlay"></div><div class="content"><div><div class="brand">${brand}</div><div class="headline">${c.headline}</div><div class="sub">${c.sub}</div></div><div class="benefits"><div class="benefit"><div class="chk">✓</div><div class="bt">${c.b1}</div></div><div class="benefit"><div class="chk">✓</div><div class="bt">${c.b2}</div></div><div class="benefit"><div class="chk">✓</div><div class="bt">${c.b3}</div></div></div><div class="bottom"><div class="contact"><span>${icon}</span><span>${contact}</span></div><button class="cta">→ ${c.cta}</button></div></div></body></html>`;
}
function renderResults(){
const cont=document.getElementById('creoCards');
cont.innerHTML='';
generatedData.forEach((item,i)=>{
const ft=`${item.copy.headline}\n${item.copy.sub}\n\n✓ ${item.copy.b1}\n✓ ${item.copy.b2}\n✓ ${item.copy.b3}\n\n→ ${item.copy.cta}`;
const card=document.createElement('div');
card.className='creative-card';
card.style.animationDelay=`${(i%6)*0.08}s`;
card.innerHTML=`<div class="card-label">// ВАРИАНТ ${i+1}</div><div class="tmpl-tag">${item.style}</div><div class="banner-preview" id="prev${i}"><iframe id="ifr${i}" srcdoc="${escQ(item.html)}" scrolling="no"></iframe></div><div class="card-copy"><div class="copy-headline">${item.copy.headline}</div><div class="copy-sub">${item.copy.sub}</div><div class="card-actions"><button class="action-btn primary" onclick="openModal(${i})">Открыть</button><button class="action-btn" onclick="cpTxt(this,\`${ft.replace(/`/g,'\\`')}\`)">Копировать</button><button class="action-btn" onclick="dlHTML(${i})">HTML ⬇</button></div></div>`;
cont.appendChild(card);
});
requestAnimationFrame(()=>{
generatedData.forEach((_,i)=>{
const p=document.getElementById(`prev${i}`);
const f=document.getElementById(`ifr${i}`);
if(p&&f)scaleIframe(f,p.offsetWidth);
});
});
const r=document.getElementById('results');
r.classList.add('visible');
r.scrollIntoView({behavior:'smooth',block:'start'});
}
function openModal(idx){
currentModal=idx;
const item=generatedData[idx];
document.getElementById('modalTitle').textContent=`ВАРИАНТ ${idx+1} — ${item.style}`;
const mf=document.getElementById('modalIframe');
mf.srcdoc=item.html;
document.getElementById('modalText').textContent=`${item.copy.headline}\n${item.copy.sub}\n\n✓ ${item.copy.b1}\n✓ ${item.copy.b2}\n✓ ${item.copy.b3}\n\n→ ${item.copy.cta}`;
document.getElementById('modal').classList.add('open');
requestAnimationFrame(()=>{
const w=document.querySelector('.modal-banner-wrap');
if(w)scaleIframe(mf,w.offsetWidth);
});
}
function dlBanner(){dlHTML(currentModal)}
function dlHTML(idx){
const b=new Blob([generatedData[idx].html],{type:'text/html'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`banner-v${idx+1}.html`;a.click();
}
function cpTxt(btn,text){
navigator.clipboard.writeText(text).then(()=>{
const o=btn.textContent;btn.textContent='✓ OK';
setTimeout(()=>btn.textContent=o,2000);
});
}
function copyModalTxt(){
const t=document.getElementById('modalText').textContent;
navigator.clipboard.writeText(t).then(()=>{
const b=document.querySelector('.modal-actions .action-btn:not(.primary)');
b.textContent='✓ Скопировано';
setTimeout(()=>b.textContent='Копировать',2000);
});
}
buildTmplGrid();
buildPresets('accentPresets',ACCENT_PRESETS,'accent');
buildPresets('bgPresets',BG_PRESETS,'bg');
hideStatus();
</script>
</body>
</html>
